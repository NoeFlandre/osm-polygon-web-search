name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check lint
        run: uv run ruff check .

      - name: Check types
        run: uv run ty check

      - name: Run tests and coverage
        run: uv run pytest -q --cov=osm_polygon_web_search --cov-report=term-missing

      - name: Build documentation strictly
        run: uv run mkdocs build --strict --site-dir site

      - name: Run mutation testing
        run: uv run mutmut run

      - name: Check mutation results
        run: test -z "$(uv run mutmut results)"

      - name: Build Docker image
        run: docker build -t osm-polygon-web-search:ci .
